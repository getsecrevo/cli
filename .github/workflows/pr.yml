name: pr

# Runs on every pull request targeting main + push to main. Linux-only
# for cost reasons (macOS minutes are billed at 10× the Linux rate on
# GitHub-hosted runners). darwin-specific behavior — primarily the
# signal forwarding in `secrevo run` — is covered by the weekly
# cross-platform workflow (`cross-platform.yml`) and on demand via
# `workflow_dispatch`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Older runs from the same PR / branch are cancelled when a new push
  # arrives so quota does not get burned on results nobody will look at.
  group: cli-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet + fmt + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        # `gofmt -l` exits 0 but prints non-conforming files. Treat any
        # printed path as a failure so style breaks block the PR.
        run: |
          unformatted=$(gofmt -l . | tee /dev/stderr)
          if [ -n "$unformatted" ]; then
            echo "::error::run 'gofmt -w' on the listed files"
            exit 1
          fi

      - name: go test -race
        run: go test -race ./...

      - name: go build
        run: go build ./cmd/secrevo
