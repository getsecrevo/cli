name: cross-platform

# Weekly macOS coverage for darwin-specific behavior in `secrevo run`
# (signal forwarding, exec semantics). macOS-latest minutes cost 10×
# Linux on GitHub-hosted runners, so this is gated behind a schedule
# instead of running on every PR.
#
# Run on demand before merging anything that touches signal handling
# or os/exec wiring:
#     gh workflow run cross-platform.yml --repo getsecrevo/cli
#
# A failure here is treated as a regression — fix on a feature branch
# and re-run with workflow_dispatch before merging.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test -race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go build ./cmd/secrevo
